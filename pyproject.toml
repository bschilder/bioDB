[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biodb"
version = "0.1.0"
description = "Biomedical knowledge graph helpers — Open Targets / Monarch / OBO ontologies"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
authors = [{ name = "Brian Schilder", email = "brian@standardmodel.bio" }]
keywords = [
    "open-targets",
    "monarch-initiative",
    "ontology",
    "mondo",
    "phenotype",
    "knowledge-graph",
    "gene-disease",
    "drug-target",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Core dependencies — every module imports at least numpy + pandas.
# matplotlib + datashader are used by ontology.py's plotting helpers
# but are lazy-imported only when the plotting paths are invoked.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=0.20",
    "requests>=2.28",
    "httpx>=0.24",
    "tqdm>=4.65",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Optional ontology + KG dependencies. gget pulls many heavy deps so it
# is opt-in. networkx + obonet + pronto + pyobo are used by various
# branches of ontology.py and opentargets.py but each is import-guarded.
ontology = [
    "networkx>=3.0",
    "obonet>=1.0",
    "pronto>=2.5",
    "pyobo>=0.10",
    "owlready2>=0.45",
]
# clinvar.py VCF ingestion path. genoray reads the ClinVar VCF and
# pooch fetches the upstream file from NCBI's FTP.
clinvar = [
    "genoray>=0.1",
    "pooch>=1.8",
]
# omicspred.py per-dataset metadata Excel parser.
omicspred = [
    "openpyxl>=3.1",
]
viz = [
    "matplotlib>=3.7",
    "datashader>=0.16",
    "colorcet>=3.0",
    "pyvis>=0.3",
]
# Tokenizer used by count_tokens() in utils.
tokens = [
    "tiktoken>=0.6",
]
# Open Targets GraphQL / VEP / etc helpers. gget is the upstream
# backend used by opentargets.py.
gget = [
    "gget>=0.28",
]
# UniProt REST client (biodb.uniprot). Biopython's SeqIO.uniprot-xml
# parser is the canonical XML reader for UniProt records.
protein = [
    "biopython>=1.83",
]
# Cross-namespace gene-id mapping (biodb.mapping.map_gene_ids).
mapping = [
    "gprofiler-official>=1.0",
]
# Pan-UKBB remote-tabix Python backend (biodb.panukbb.sumstats_region,
# backend="pysam"). The DEFAULT backend shells out to the htslib ``tabix``
# CLI — present in any bcftools/seqlab environment — so pysam is optional.
panukbb = [
    "pysam>=0.22",
]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "coverage-badge>=1.1",
    # Mock HTTP for ``requests``-based clients (gwas_atlas, gprofiler,
    # msigdb, harmonizome, ...). Used by every source-client test so the
    # offline path stays deterministic. ``httpx`` is mocked via the
    # built-in MockTransport.
    "responses>=0.25",
    # pandas' parquet engine isn't bundled. ``opentargets.get_dataset``
    # and ``harmonizome.get_gmt`` both call ``pd.read_parquet`` /
    # ``DataFrame.to_parquet`` and crash on a fresh install without one
    # of these engines.
    "pyarrow>=14.0",
    # CI runs live integration tests against every source; the protein
    # tests (uniprot) need biopython, the mapping tests need gprofiler,
    # and the ontology tests need owlready2 + networkx. Without these
    # the live tests skip silently — defeating the point.
    "biopython>=1.83",
    "gprofiler-official>=1.0",
    "owlready2>=0.45",
    "networkx>=3.0",
]
dev = ["biodb[ontology,viz,tokens,gget,protein,clinvar,mapping,docs,test]"]

[project.urls]
Homepage = "https://github.com/bschilder/bioDB"
Repository = "https://github.com/bschilder/bioDB"
Issues = "https://github.com/bschilder/bioDB/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"biodb" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=biodb",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "slow: tests > ~5s",
    "network: tests that hit a live remote API (skipped in CI)",
]

[tool.coverage.run]
branch = true
source = ["biodb"]
omit = [
    # The four vendored modules are huge surface-area ports. Each has
    # many branches (Open Targets API shapes, gget fallbacks, OBO
    # readers, mondo loaders, ClinVar VCF parsing, pooch downloads)
    # that are unreachable without live network access or optional
    # heavy deps. The CPU/no-net CI exercises the import surface +
    # signature shape only.
    "src/biodb/opentargets/_bulk.py",
    "src/biodb/monarch.py",
    "src/biodb/ontology.py",
    "src/biodb/clinvar.py",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "except ImportError",
    "except Exception as e:",
    "raise ImportError",
    "raise FileNotFoundError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
    # Vendored ports of AoU.phenome.{opentargets,monarch,ontology} +
    # VEP_protein.clinvar — treat as third-party (style fixes belong
    # upstream, not here).
    "src/biodb/opentargets/_bulk.py",
    "src/biodb/monarch.py",
    "src/biodb/ontology.py",
    "src/biodb/clinvar.py",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM",
]
ignore = [
    "E501", # line-too-long — formatter handles
    "B008", # function-call-in-default-argument — common idiom
]
